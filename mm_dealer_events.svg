tainer .node .label,#container .image-shape .label,#container .icon-shape .label{text-align:center;}#container .node.clickable{cursor:pointer;}#container .root .anchor path{fill:#fc6a60!important;stroke-width:0;stroke:#fc6a60;}#container .arrowheadPath{fill:#0b0b0b;}#container .edgePath .path{stroke:#fc6a60;stroke-width:2.0px;}#container .flowchart-link{stroke:#fc6a60;fill:none;}#container .edgeLabel{background-color:#fc6a60;text-align:center;}#container .edgeLabel p{background-color:#fc6a60;}#container .edgeLabel rect{opacity:0.5;background-color:#fc6a60;fill:#fc6a60;}#container .labelBkg{background-color:rgba(252, 106, 96, 0.5);}#container .cluster rect{fill:#282828;stroke:hsl(0, 0%, 5.6862745098%);stroke-width:1px;}#container .cluster text{fill:#d7d7d7;}#container .cluster span{color:#d7d7d7;}#container div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:#282828;border:1px solid hsl(0, 0%, 5.6862745098%);border-radius:2px;pointer-events:none;z-index:100;}#container .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#ecc58d;}#container rect.text{fill:none;stroke-width:0;}#container .icon-shape,#container .image-shape{background-color:#fc6a60;text-align:center;}#container .icon-shape p,#container .image-shape p{background-color:#fc6a60;padding:2px;}#container .icon-shape rect,#container .image-shape rect{opacity:0.5;background-color:#fc6a60;fill:#fc6a60;}#container .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#container .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#container :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><marker id="container_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arro