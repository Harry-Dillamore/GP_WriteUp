; width: 200px;"><span class="nodeLabel"><p><b>UpdateAllScores</b><br/>Synchronises the latest authoritative score values across all client UIs</p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(385, 0)"><g class="clusters"><g class="cluster" id="subGraph1" data-look="classic"><rect style="" x="8" y="8" width="335" height="796"></rect><g class="cluster-label" transform="translate(90.7421875, 8)"><foreignObject width="169.515625" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>Core Game Loop Events</p></span></div></foreignObject></g></g></g><g class="edgePaths"></g><g class="edgeLabels"></g><g class="nodes"><g class="node default" id="flowchart-Core1-3" transform="translate(175.5, 118)"><rect class="basic label-container" style="" x="-130" y="-75" width="260" height="150"></rect><g class="label" style="" transform="translate(-100, -60)"><rect></rect><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>Turn</b><br/>Initialises the active player's state and begins polling for their card selection</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-Core2-4" transform="translate(175.5, 318)"><rect class="basic label-container" style="" x="-130" y="-75" width="260" height="150"></rect><g class="label" style="" transform="translate(-100, -60)"><rect></rect><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>AuditPhase</b><br/>Evaluates if truth/bluff conditions were met and distributes server-side score penalties</p></span