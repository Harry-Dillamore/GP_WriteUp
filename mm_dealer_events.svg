" width="260" height="126"></rect><g class="label" style="" transform="translate(-100, -48)"><rect></rect><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>GetNarratorBPReference</b><br/>Runs on BeginPlay to securely locate and cache the Narrator Actor</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-Init2-1" transform="translate(175.5, 282)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"></rect><g class="label" style="" transform="translate(-100, -48)"><rect></rect><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>StartGame</b><br/>Wipes existing data and resets the card pool for a fresh session</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-Init3-2" transform="translate(175.5, 458)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"></rect><g class="label" style="" transform="translate(-100, -48)"><rect></rect><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>StartingDeal</b><br/>Iterates through all valid players to dispense their initial 5 cards</p></span></div></foreignObject></g></g></g></g></g></g></g></svg>